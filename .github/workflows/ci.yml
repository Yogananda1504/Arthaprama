name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx flake8 black

      - name: Check code formatting with Black
        run: |
          black --check .

      - name: Lint with Flake8
        run: |
          flake8 arthaprama backend tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 arthaprama backend tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/unit/ --cov=arthaprama --cov=backend --cov-report=term-missing --cov-fail-under=70

      - name: Run integration tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/integration/ --cov=arthaprama --cov=backend --cov-report=term-missing --cov-append

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: .coverage
