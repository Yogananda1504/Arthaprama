# Pyproject.toml for Arthaprama - IPO Analysis Engine
# Modern dependency management with Poetry

[tool.poetry]
name = "arthaprama"
version = "0.1.0"
description = "IPO Growth, Risk, and Valuation Framework with FastAPI & MCP Server"
authors = ["Arthaprama Team"]
readme = "README.md"
packages = [
    { include = "arthaprama" },
    { include = "backend" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.109.0,<1.0.0"
pydantic = ">=2.12.0,<3.0.0"
pydantic-settings = ">=2.1.0,<3.0.0"
uvicorn = { extras = ["standard"], version = ">=0.27.0,<1.0.0" }
numpy = ">=1.26.3,<2.0.0"
pandas = ">=2.1.4,<3.0.0"
httpx = ">=0.27.2,<1.0.0"
python-multipart = ">=0.0.32,<1.0.0"
mcp = {version = ">=1.0.0,<2.0.0", extras = ["cli"]}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.4,<8.0.0"
pytest-asyncio = ">=0.23.3,<1.0.0"
pytest-cov = ">=4.1.0,<5.0.0"
mypy = ">=1.8.0,<2.0.0"
ruff = ">=0.1.14,<1.0.0"
black = ">=24.1.0,<25.0.0"
flake8 = ">=7.0.0,<8.0.0"
mkdocs = ">=1.5.3,<2.0.0"
mkdocs-material = ">=9.5.3,<10.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Pytest Configuration for Arthaprama IPO Analysis
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=arthaprama",
    "--cov=backend",
    "--cov-report=term-missing",
]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]

# Coverage Configuration
[tool.coverage.run]
source = ["arthaprama", "backend"]
branch = true
omit = [
    "*/__init__.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Flake8 Configuration
[tool.flake8]
max-line-length = 127
max-complexity = 10
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]
per-file-ignores = ["__init__.py:F401"]

# Black Configuration
[tool.black]
line-length = 127
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
force-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# MyPy Configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
