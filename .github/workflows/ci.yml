name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --with dev

      - name: Run Linters
        run: |
          poetry run ruff check .
          poetry run black --check .

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: .
        run: |
          poetry run pytest tests/unit/ --cov=arthaprama --cov=backend --cov-report=term-missing --cov-fail-under=70

      - name: Run integration tests
        env:
          PYTHONPATH: .
        run: |
          poetry run pytest tests/integration/ --cov=arthaprama --cov=backend --cov-report=term-missing --cov-append

      - name: Run MCP tests
        env:
          PYTHONPATH: .
        run: |
          poetry run pytest tests/test_mcp.py --cov=arthaprama --cov=backend --cov-report=term-missing --cov-append

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: .coverage
